@if (this.delete$ | async) {}
@if (this.$title | async) {}

@if (loading()) {
  <app-graphql-spinner [loading]="loading()" />
}

@if (error) {
  <div>Error :{{ error }}</div>
}

<app-change-blogitle />

@for (collection of collection$ | async; track collection?.title) {
  <div class="row">
    <app-collection-admin-row
      (idUpForDelete)="deleteCollection($event)"
      [collection]="collection"
    />
    <button (click)="openDialog(collection)">update</button>
  </div>
}

<button (click)="openDialog(null)">create collection</button>
<button (click)="logout()">logout</button>

<app-create-nav-member />
