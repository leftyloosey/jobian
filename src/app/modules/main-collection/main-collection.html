@if (loading()) {
  <app-graphql-spinner [loading]="loading()" />
}
@if (error) {
  <div>Error :{{ error }}</div>
}

@for (collection of this.display$ | async; track collection?.title) {
  <div class="main-collection">
    <div>
      <app-collection-card [collectionDown]="collection" />
    </div>
    <div></div>
  </div>
}
