@if (submit$ | async) {}
@if (data$ | async) {}

<h2>{{ title() }}</h2>
<h3>{{ heading() }}</h3>
@if (loading()) {
  <app-graphql-spinner [loading]="loading()" />
}

@for (post of posts; track post?.id) {
  <div>
    {{ post?.title }}
    <button (click)="editPost(post?.id ?? 0)">edit</button>
  </div>
}
<div><button (click)="newPost()">new</button></div>
<button (click)="backToAdmin()">back to admin</button>
