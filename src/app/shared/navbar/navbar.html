<section class="navbar">
  <div class="navbar__title-frame">
    <p class="navbar__title">
      <a class="navbar__title--text" [routerLink]="home">{{ title }}</a>
    </p>
  </div>
  <div class="navbar__options-frame">
    <p class="navbar__option">
      <a class="navbar__option--text" [routerLink]="about">About</a>
    </p>
    <p class="navbar__option">
      <a class="navbar__option--text" [routerLink]="team">Team</a>
    </p>
    <p class="navbar__option">
      <a class="navbar__option--text" [routerLink]="contact">Contact</a>
    </p>
    @if (loggedIn()) {
      <p class="navbar__option">
        <a class="navbar__option--text" [routerLink]="admin">Admin</a>
      </p>
    }
  </div>
</section>
