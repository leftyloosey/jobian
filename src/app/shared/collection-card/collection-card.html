<mat-card appearance="outlined">
  <div
    class="collection-card"
    style="cursor: pointer"
    (click)="openCollection(collection?.urlTitle)"
  >
    <mat-card-header>
      <img [src]="collection?.headerImageString" />
    </mat-card-header>
    <mat-card-header>
      <mat-card-title>{{ collection?.title }}</mat-card-title>
      <mat-card-subtitle class="collection-card__subtitle">{{
        collection?.heading
      }}</mat-card-subtitle>
    </mat-card-header>
  </div>

  <mat-card-actions align="end">
    <button matButton (click)="openCollection(collection?.urlTitle)">
      Learn More
    </button>
  </mat-card-actions>
</mat-card>
