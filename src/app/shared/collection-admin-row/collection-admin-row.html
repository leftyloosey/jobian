<mat-card class="collection-card" appearance="outlined">
  <img
    class="collection-card__image"
    [src]="downCollection()?.headerImageString"
  />

  <mat-card-header class="collection-card__header">
    <mat-card-title>{{ downCollection()?.title }}</mat-card-title>
    <mat-card-subtitle class="collection-card__subtitle">{{
      downCollection()?.heading
    }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-actions align="end">
    <button matButton (click)="openCollection()">Open</button>
    <button matButton (click)="updateCollection()">Update</button>
    <button matButton (click)="deleteCollection()">Delete</button>
  </mat-card-actions>
</mat-card>
