<mat-card appearance="outlined">
  <div class="post-card">
    <!-- <mat-card-header> -->
    <img class="post-card__image" [src]="postDown().headerImageString" />
    <!-- </mat-card-header> -->
    <mat-card-header>
      <mat-card-title>
        <a
          routerLink
          class="post-card__title"
          (click)="goToPost(postDown().id)"
          >{{ postDown().title }}</a
        >
        <span class="post-card__subtitle">
          {{ postDown().heading }}
        </span>
      </mat-card-title>
    </mat-card-header>
  </div>

  <!-- <mat-card-actions align="end">
    <button matButton (click)="openCollection(collection?.urlTitle)">
      Learn More
    </button>
  </mat-card-actions> -->
</mat-card>
